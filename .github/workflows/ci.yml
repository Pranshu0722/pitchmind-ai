name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Backend: lint + typecheck + unit tests
  # ----------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pitchmind_test
          POSTGRES_USER: pitchmind
          POSTGRES_PASSWORD: pitchmind_test_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data

    env:
      DATABASE_URL: postgresql+asyncpg://pitchmind:pitchmind_test_pw@localhost:5432/pitchmind_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      APP_SECRET_KEY: ci-test-secret-key-32-chars-min!!
      JWT_SECRET_KEY: ci-test-jwt-secret
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: pitchmind
      MLFLOW_TRACKING_URI: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check src/ tests/

      - name: Format check (ruff-format)
        working-directory: backend
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy src/pitchmind

      - name: Unit tests
        working-directory: backend
        run: uv run pytest tests/unit -v --tb=short --cov=src/pitchmind --cov-report=xml

      - name: Integration tests
        working-directory: backend
        run: uv run pytest tests/integration -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: backend/coverage.xml
          flags: backend

  # ----------------------------------------------------------------
  # Frontend: lint + typecheck + unit tests
  # ----------------------------------------------------------------
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Format check (prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Type check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm run test:unit -- --run

  # ----------------------------------------------------------------
  # Security: dependency audit
  # ----------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: |
          uv tool install pip-audit
          uv export --no-dev --format requirements-txt | grep -v "^-e " > /tmp/requirements.txt
          uv tool run pip-audit --requirement /tmp/requirements.txt

      - name: Node dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
