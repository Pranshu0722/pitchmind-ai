[project]
name = "pitchmind"
version = "0.1.0"
description = "PitchMind AI — Multi-Agent Football Intelligence Platform"
authors = [{ name = "Pranshu0722", email = "pranshu.0422@gmail.com" }]
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "MIT" }

# ----------------------------------------------------------------
# CORE dependencies — installed from Phase 2 onward
# uv sync  (no extras needed for Phases 1-5)
# ----------------------------------------------------------------
dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",

  # Config & validation
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",

  # Auth
  "python-jose[cryptography]>=3.3.0",
  "passlib[argon2]>=1.7.4",
  "authlib>=1.3.2",
  "itsdangerous>=2.2.0",

  # Database
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",

  # Cache / Queue
  "redis[hiredis]>=5.2.0",
  "dramatiq[redis]>=1.17.0",

  # Object storage
  "boto3>=1.35.0",
  "aioboto3>=13.2.0",

  # HTTP client
  "httpx>=0.28.0",

  # Rate limiting
  "slowapi>=0.1.9",

  # Observability
  "structlog>=24.4.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "sentry-sdk[fastapi]>=2.19.0",

  # PDF generation
  "reportlab>=4.2.0",
  "Pillow>=11.0.0",
]

# ----------------------------------------------------------------
# OPTIONAL groups — installed per phase
# ----------------------------------------------------------------
[project.optional-dependencies]

# Phase 6-7: Computer Vision
# uv sync --extra cv
cv = [
  "opencv-python-headless>=4.10.0",
  "ultralytics>=8.3.0",        # YOLOv11
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "scipy>=1.14.0",
]

# Phase 9-11: Machine Learning
# uv sync --extra ml
ml = [
  "scikit-learn>=1.6.0",
  "xgboost>=2.1.0",
  "lightgbm>=4.5.0",
  "shap>=0.46.0",
  "mlflow>=2.19.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "optuna>=4.1.0",
]

# Phase 12: Agentic AI
# uv sync --extra agents
agents = [
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langchain-anthropic>=0.3.0",
  "langchain-openai>=0.3.0",
  "langchain-ollama>=0.2.0",
  "sentence-transformers>=3.3.0",
]

# Install everything (full environment)
# uv sync --extra all
all = [
  "pitchmind[cv,ml,agents]",
]

# ----------------------------------------------------------------
# Dev / test tooling
# ----------------------------------------------------------------
[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "testcontainers[postgres,redis]>=4.9.0",
  "factory-boy>=3.3.0",
  "faker>=33.0.0",
  "anyio>=4.7.0",
  "mypy>=1.13.0",
  "ruff>=0.9.0",
  "types-redis>=4.6.0",
  "types-passlib>=1.7.7",
  "pre-commit>=4.0.0",
]

# ----------------------------------------------------------------
# Tool configuration
# ----------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pitchmind"]
omit = ["*/migrations/*", "*/tests/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchmind"]
